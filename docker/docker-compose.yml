# ==============================================================================
# Engineering Document Intelligence & CAD Knowledge Copilot
# Docker Compose Orchestration (Subdirectory Reference)
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: engineering_copilot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-engineering_copilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-engineering_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - copilot_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: engineering_copilot_backend
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-Engineering Document Intelligence & CAD Knowledge Copilot}"
      APP_ENV: "${APP_ENV:-production}"
      DEBUG: "${DEBUG:-False}"
      HOST: "0.0.0.0"
      PORT: "8000"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-engineering_copilot}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-auto}"
      SEARCH_PROVIDER: "${SEARCH_PROVIDER:-auto}"
      LLM_PROVIDER: "${LLM_PROVIDER:-auto}"
      AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY:-}"
      AZURE_OPENAI_ENDPOINT: "${AZURE_OPENAI_ENDPOINT:-}"
      AZURE_OPENAI_DEPLOYMENT: "${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}"
      AZURE_SEARCH_ENDPOINT: "${AZURE_SEARCH_ENDPOINT:-}"
      AZURE_SEARCH_API_KEY: "${AZURE_SEARCH_API_KEY:-}"
      AZURE_SEARCH_INDEX_NAME: "${AZURE_SEARCH_INDEX_NAME:-engineering-docs-index}"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../data/documents:/app/data/documents
      - ../data/processed:/app/data/processed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - copilot_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: engineering_copilot_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - copilot_network

networks:
  copilot_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
